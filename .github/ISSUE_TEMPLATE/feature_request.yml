name: Feature Request
description: Propose a new feature for the App
title: "[FEAT] "
labels: ["feat"]
body:
  - type: checkboxes
    id: preflight
    attributes:
      label: Before requesting
      options:
        - label: I searched the existing issues and this has not been requested.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that Sanctum makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should Sanctum do instead?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you tried, or other designs you weighed.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Privacy constraints
      description: Sanctum is local-first by design. Confirm the proposal fits.
      options:
        - label: This feature does not require sending user data to a third party.
        - label: This feature works offline, or degrades gracefully without network.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Screenshots, links, or prior art.
    validations:
      required: false
