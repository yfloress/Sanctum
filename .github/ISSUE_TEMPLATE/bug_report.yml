name: Bug Report
description: Report a bug or error
title: "[BUG] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a report.

        **Never include real financial data, wallet addresses, or your vault
        password.** Redact anything sensitive before attaching logs or
        screenshots.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before reporting
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I am on the latest commit of `main`, or I state below which build I am on.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      value: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (desktop)
        - Windows (desktop)
        - macOS (desktop)
        - Android
        - Browser (self-hosted server)
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS Version
      description: Distribution and version, or OS build.
      placeholder: "e.g. Fedora 44, Windows 11 23H2, Android 15"
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: "e.g. 0.1.0-alpha, or the commit hash you built from"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Relevant output, if any. Redact anything sensitive.
      render: text
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: Optional. Images that help explain the problem.
    validations:
      required: false
      accept: ".png,.jpg,.jpeg,.gif,.webp,.mp4"
