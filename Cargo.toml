[workspace]
members = ["src-tauri"]
resolver = "3"

[package]
name = "sanctum"
version = "0.1.0"
edition = "2024"
authors = ["Kyronix"]
license = "AGPL-3.0-or-later"
description = "Your personal financial fortress. Private. Encrypted. Local-first."
repository = "https://codeberg.org/Kyronix/Sanctum"
homepage = "https://codeberg.org/Kyronix/Sanctum"
readme = "README.md"
keywords = ["finance", "privacy", "crypto", "tauri", "sqlite"]
categories = ["cryptography", "database"]
exclude = [
    "assets/*",
    ".envrc"
]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
csv = "1.4"
directories = "6"
env_logger = "0.11"
fluent-bundle = "0.16"
fluent-syntax = "0.12"
futures = "0.3"
log = "0.4"
rand = "0.10"
regex = "1.12"
reqwest = { version = "0.13", features = ["json", "stream", "socks"] }
rusqlite = { version = "0.39", features = ["bundled-sqlcipher"] }
secrecy = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "1"
unic-langid = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }
