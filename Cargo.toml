[package]
name = "sanctum"
version = "0.1.0"
edition = "2024"
build = "build.rs"
authors = ["Kyronix"]
license = "AGPL-3.0-or-later"
description = "Your personal financial fortress. Private. Encrypted. Local-first."
repository = "https://codeberg.org/Kyronix/Sanctum"
homepage = "https://codeberg.org/Kyronix/Sanctum"
readme = "README.md"
keywords = ["finance", "privacy", "crypto", "slint", "sqlite"]
categories = ["cryptography", "database"]
exclude = [
    ".img/*",
    ".envrc"
]

[[bin]]
name = "sanctum"
path = "src/main.rs"

[dependencies]
slint = { version = "1.8", features = ["renderer-winit-skia", "default"] }
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
secrecy = "0.10"
thiserror = "1.0"
log = "0.4"
env_logger = "0.11"
directories = "5.0"
reqwest = { version = "0.11", features = ["json", "stream"] }
futures = "0.3"
regex = "1"

[build-dependencies]
slint-build = "1.9"
