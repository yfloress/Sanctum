[package]
name = "sanctum-tauri"
version = "0.1.0"
edition = "2024"
authors = ["Kyronix"]
license = "AGPL-3.0-or-later"
description = "Sanctum Tauri shell"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sanctum = { path = ".." }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
directories = "6"
chrono = "0.4"

[build-dependencies]
tauri-build = { version = "2", features = [] }
